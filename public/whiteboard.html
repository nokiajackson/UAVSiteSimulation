<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>場地白板</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;color:#244438;background:#eef2ee}header{padding:14px 20px;background:#173c30;color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}h1{font-size:18px;margin:0}header a{color:#d4e9dc;font-size:13px}nav{padding:12px 20px;display:flex;gap:9px;align-items:center;flex-wrap:wrap}button,label{font:inherit;font-size:14px}button{border:1px solid #cbd7cf;background:white;color:#244438;border-radius:6px;padding:9px 14px;cursor:pointer}button.active{background:#244e3b;color:white}input[type=color]{width:36px;height:34px;border:0;background:transparent}input[type=range]{width:90px;accent-color:#276d4a}#save{background:#24694a;color:white}p{margin:0 20px 12px;font-size:13px;color:#6b8071}main{margin:0 16px 16px;height:calc(100dvh - 175px);min-height:320px;border:1px solid #cbd7cf;border-radius:8px;overflow:hidden;background:white}canvas{display:block;width:100%;height:100%;touch-action:none;cursor:crosshair}#status{font-size:12px;color:#607565}
</style></head><body><header><h1>場地白板 / 畫出你的賽道</h1><a href="/">返回 3D 場景</a></header><nav><button id="pen" class="active">畫筆</button><button id="eraser">橡皮擦</button><label>顏色 <input aria-label="畫筆顏色" type="color" value="#e34132" id="color"></label><label>粗細 <input aria-label="畫筆粗細" type="range" min="2" max="20" value="4" id="size"></label><button id="undo">復原</button><button id="clear">清空</button><button id="save">下載圖片</button><span id="status">尚未繪製</span></nav><p>可用滑鼠、觸控筆或手指。請標示起點 H、三個環的位置與方向、終點和飛行箭頭；畫好後下載圖片並傳到對話中。</p><main><canvas id="board" aria-label="場地繪圖白板"></canvas></main><script>
const canvas=document.querySelector('canvas'),ctx=canvas.getContext('2d');
const strokes=[];let current=null,erasing=false;const status=document.querySelector('#status');
function render(){ctx.fillStyle='#ffffff';ctx.fillRect(0,0,canvas.width,canvas.height);const scale=canvas.width/1200;ctx.save();ctx.scale(scale,scale);for(const s of strokes){ctx.strokeStyle=s.color;ctx.lineWidth=s.size;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();s.points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));if(s.points.length===1)ctx.lineTo(s.points[0][0]+.01,s.points[0][1]);ctx.stroke();}ctx.restore();status.textContent=strokes.length?'已繪製 '+strokes.length+' 筆':'尚未繪製';}
function resize(){const rect=canvas.getBoundingClientRect();canvas.width=Math.round(rect.width*devicePixelRatio);canvas.height=Math.round(rect.height*devicePixelRatio);render();}
function point(e){const r=canvas.getBoundingClientRect();return[(e.clientX-r.left)*1200/r.width,(e.clientY-r.top)*1200/r.width];}
canvas.addEventListener('pointerdown',e=>{if(e.button!==0)return;canvas.setPointerCapture(e.pointerId);current={color:erasing?'#ffffff':document.querySelector('#color').value,size:+document.querySelector('#size').value*(erasing?5:1),points:[point(e)]};strokes.push(current);render();});
canvas.addEventListener('pointermove',e=>{if(current){current.points.push(point(e));render();}});
for(const event of ['pointerup','pointercancel','lostpointercapture'])canvas.addEventListener(event,()=>current=null);
function tool(value){erasing=value;document.querySelector('#pen').classList.toggle('active',!value);document.querySelector('#eraser').classList.toggle('active',value);}
document.querySelector('#pen').onclick=()=>tool(false);document.querySelector('#eraser').onclick=()=>tool(true);document.querySelector('#undo').onclick=()=>{current=null;strokes.pop();render();};document.querySelector('#clear').onclick=()=>{if(strokes.length&&confirm('清空這張白板？')){current=null;strokes.length=0;render();}};document.querySelector('#save').onclick=()=>{canvas.toBlob(blob=>{if(!blob)return;const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='uav-course.png';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);});};new ResizeObserver(resize).observe(canvas.parentElement);
</script></body></html>
